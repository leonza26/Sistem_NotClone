<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline | Flowral</title>
  <link rel="icon" type="image/png" href="/img/Logo_Flowral.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F5FAFB;
      color: #282B2A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      .card {
        background-color: #1e293b !important;
        border-color: #334155 !important;
      }
      .desc {
        color: #94a3b8 !important;
      }
      .icon-circle {
        background-color: rgba(229, 117, 0, 0.1) !important;
      }
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(129, 180, 197, 0.2);
      border-radius: 28px;
      padding: 48px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(40, 43, 42, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff4eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-svg {
      width: 40px;
      height: 40px;
      stroke: #E57500;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .highlight {
      color: #E57500;
    }
    .desc {
      font-size: 14px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 32px;
      font-weight: 300;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      background: #E57500;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(229, 117, 0, 0.35);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #c86600;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(229, 117, 0, 0.45);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Koneksi <span class="highlight">Terputus.</span></h1>
    <p class="desc">
      Ponsel Anda saat ini sedang offline. Periksa kembali sambungan Wi-Fi atau data seluler Anda, lalu coba muat ulang halaman.
    </p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Coba Muat Ulang
    </button>
  </div>
</body>
</html>
